<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Log in to PassSabi AI." />
  <meta name="theme-color" content="#0f172a" />
  <title>Login | PassSabi AI</title>

  <link rel="stylesheet" href="css/auth.css" />
  <script defer src="js/auth.js"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-label="Login form">
      <header class="auth-header">
        <a class="brand" href="index.html" aria-label="Back to home">
          <div class="brand-badge">P</div>
          <div class="brand-text">
            <strong>PassSabi AI</strong>
            <span>Your Personal AI Teacher</span>
          </div>
        </a>

        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to continue your learning journey and access your chats.</p>
      </header>

      <div class="auth-body">
        <div id="loginNotice" class="notice" aria-live="polite"></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <div class="label-row">
              <label for="loginEmail">Email address</label>
            </div>
            <input
              id="loginEmail"
              type="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="loginPassword">Password</label>
              <a class="helper-link" href="forgot-password.html">Forgot password?</a>
            </div>

            <div class="input-wrap">
              <input
                id="loginPassword"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
              <button type="button" class="input-icon-btn" data-toggle-password data-target="loginPassword">
                Show
              </button>
            </div>
          </div>

          <div class="row" style="margin-bottom: 16px;">
            <label class="checkbox">
              <input id="rememberMe" type="checkbox" />
              <span>Remember me</span>
            </label>
          </div>

          <button id="loginBtn" class="auth-btn" type="submit">Login</button>
        </form>
      </div>

      <div class="auth-footer">
        Don’t have an account? <a href="signup.html">Create one</a>
      </div>
    </section>
  </main>
</body>
</html>
