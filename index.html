<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PassSabi AI</title>

    <style>
        body {
            background-color: #0d1624; /* Dark blue background */
            color: #ffffff;            /* White text */
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
        }
        h1 { font-size: 2.5em; margin-bottom: 10px; }
        .tagline { color: #3498db; font-size: 1.2em; margin-bottom: 20px; }
        .description { line-height: 1.6; margin-bottom: 30px; }
        
        button {
            background-color: #2e64fe; /* Blue button */
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .founder-section {
            margin-top: 30px;
        }
        .founder-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎓 PassSabi AI</h1>
        
        <p class="tagline">Learn Smarter. Pass Better.</p>

        <p class="description">
            PassSabi AI helps students prepare for Internal School Exams, WAEC, NECO, JAMB, GCE, NABTEB and many other examinations using AI.
        </p>

        <button id="btn">Ask PassSabi AI</button>

        <div class="founder-section">
            <p class="founder-name">Founded by Efezino Uzezi</p>
            <p>Building the future of AI-powered learning.</p>
        </div>
    </div>

    <script>
        document.getElementById('btn').onclick = function() {
            alert("Welcome to PassSabi AI!");
        };
    </script>
</body>
</html>
