<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="PassSabi AI — Your Personal AI Teacher." />
  <meta name="theme-color" content="#0f172a" />
  <meta name="robots" content="index, follow" />
  <meta http-equiv="refresh" content="2;url=chat.html" />

  <link rel="canonical" href="https://passsabi.vercel.app/" />
  <title>PassSabi AI</title>

  <link rel="stylesheet" href="css/auth.css">
<script defer src="js/auth.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --card: rgba(15, 23, 42, 0.92);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #0ea5e9;
      --border: rgba(148, 163, 184, 0.16);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.12), transparent 30%),
        radial-gradient(circle at top right, rgba(14, 165, 233, 0.10), transparent 28%),
        linear-gradient(180deg, #08111f 0%, #0f172a 100%);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      padding: 24px;
    }

    .card {
      width: min(100%, 460px);
      border-radius: var(--radius);
      padding: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      text-align: center;
    }

    .brand {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 1.8rem;
      font-weight: 800;
      box-shadow: 0 14px 32px rgba(14, 165, 233, 0.28);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
      color: #f8fafc;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .loader {
      width: 100%;
      height: 6px;
      margin: 22px 0 18px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.14);
      overflow: hidden;
      position: relative;
    }

    .loader::before {
      content: "";
      position: absolute;
      inset: 0;
      width: 40%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      animation: slide 1.1s infinite ease-in-out;
    }

    @keyframes slide {
      0% {
        transform: translateX(-120%);
      }
      100% {
        transform: translateX(280%);
      }
    }

    .hint {
      font-size: 0.92rem;
      margin-top: 8px;
      color: #cbd5e1;
    }

    noscript .warning {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(248, 113, 113, 0.22);
      background: rgba(248, 113, 113, 0.10);
      color: #fecaca;
      font-size: 0.92rem;
      line-height: 1.5;
    }
  </style>

  <script>
    window.addEventListener("DOMContentLoaded", function () {
      setTimeout(function () {
        window.location.replace("chat.html");
      }, 1200);
    });
  </script>
</head>
<body>
  <main class="card" aria-label="PassSabi loading screen">
    <div class="brand">P</div>
    <h1>PassSabi AI</h1>
    <p>Your Personal AI Teacher</p>
    <div class="loader" aria-hidden="true"></div>
    <div class="hint">Opening your learning space...</div>

    <noscript>
      <div class="warning">
        JavaScript is turned off. You can continue to the chat page manually:
        <a href="chat.html">Open PassSabi AI</a>
      </div>
    </noscript>
  </main>
</body>
</html>
