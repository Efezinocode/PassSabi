<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="PassSabi AI settings." />
  <title>Settings | PassSabi AI</title>

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <header class="auth-header">
        <button type="button" class="back-btn" data-back-button aria-label="Go back">←</button>
        <a class="brand" href="index.html" aria-label="Back to home">
          <div class="brand-badge">P</div>
          <div class="brand-text">
            <strong>PassSabi AI</strong>
            <span>App settings</span>
          </div>
        </a>

        <h1 class="auth-title">Settings</h1>
        <p class="auth-subtitle">This page is ready for theme, privacy, and app preferences.</p>
      </header>

      <div class="auth-body">
        <div class="profile-panel">
          <div class="profile-item">
            <span>Signed in as</span>
            <strong id="settingsUserName">—</strong>
          </div>
          <div class="profile-item">
            <span>Email</span>
            <strong id="settingsUserEmail">—</strong>
          </div>
          <div class="profile-item">
            <span>Status</span>
            <strong id="settingsUserStatus">—</strong>
          </div>
        </div>

        <div class="profile-panel" style="margin-top:18px;">
          <div class="profile-item">
            <span>Theme</span>
            <strong>Dark</strong>
          </div>
          <div class="profile-item">
            <span>Language</span>
            <strong>English</strong>
          </div>
          <div class="profile-item">
            <span>Notifications</span>
            <strong>Off</strong>
          </div>
        </div>

        <div class="profile-actions" style="margin-top:18px;">
          <a class="secondary-btn" href="user-chat.html">Back to chat</a>
          <button data-shell-logout class="auth-btn" type="button">Logout</button>
        </div>
      </div>

      <div class="auth-footer">
        <a href="user-chat.html">Back to chat</a>
      </div>
    </section>
  </main>

  <script type="module" src="js/user-shell.js"></script>
</body>
</html>
