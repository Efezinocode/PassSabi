<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact PassSabi AI for support, feedback, suggestions, and partnership opportunities.">
  <meta name="keywords" content="PassSabi AI, Contact, AI learning, education, support">
  <meta name="author" content="Uzezi Great Efezino">

  <title>Contact | PassSabi AI</title>

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      flex-wrap: wrap;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .nav-left h2 {
      margin: 0;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      font-weight: 600;
      color: #e2e8f0;
      transition: color 0.2s ease, transform 0.2s ease, opacity 0.2s ease;
    }

    .nav-links a:hover {
      color: #38bdf8;
      transform: translateY(-1px);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
      color: #0f172a;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.12);
      flex: 0 0 auto;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    .back-btn:active {
      transform: scale(0.95);
    }

    @media (max-width: 768px) {
      .navbar {
        padding: 14px 16px;
      }

      .nav-links {
        width: 100%;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar" aria-label="Main Navigation">
      <div class="nav-left">
        <a href="javascript:history.back()" class="back-btn" aria-label="Go back">←</a>
        <h2>🎓 PassSabi AI</h2>
      </div>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="guest-chat.html">Start Free Chat</a>
      </div>
    </nav>
  </header>

  <main class="container">

    <p class="description">
      Have questions, suggestions, or feedback? We'd love to hear from you. Your ideas help us improve PassSabi AI for students everywhere.
    </p>

    <p class="description">
      <strong>Email:</strong><br>
      <a href="mailto:efezinogreat001@gmail.com">efezinogreat001@gmail.com</a>
    </p>

    <p class="description">
      Founder: <strong>Uzezi Great Efezino</strong>
    </p>
  </main>
</body>
</html>
