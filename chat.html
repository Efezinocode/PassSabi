<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PassSabi AI Chat</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1>💬 PassSabi AI</h1>

        <p class="tagline">Your Personal AI Teacher</p>

        <div id="chat-box">
            <p><strong>PassSabi AI:</strong> 👋 Welcome! Ask me any question about your studies.</p>
        </div>

        <input
            type="text"
            id="userInput"
            placeholder="Type your question here..."
        >

        <button id="sendBtn">Send</button>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
