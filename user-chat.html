<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Chat with PassSabi AI for homework help, exam preparation, explanations, and learning support." />
  <meta name="color-scheme" content="dark" />
  <title>PassSabi AI Chat | User</title>

  <link rel="stylesheet" href="css/main.css" />
  <script type="module" src="js/theme.js"></script>
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/chat.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="chat-page">

  <header class="chat-topbar">
    <button
      type="button"
      class="menu-button"
      aria-label="Go back"
      onclick="window.history.length > 1 ? window.history.back() : window.location.href='index.html'">
      ←
    </button>

    <button
      id="menuBtn"
      type="button"
      class="menu-button"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="sidebar">
      ☰
    </button>

    <a class="chat-brand" href="index.html" aria-label="PassSabi AI home">
      <span class="chat-brand-mark">P</span>
      <span class="chat-brand-copy">
        <strong>PassSabi AI</strong>
        <span>Your Personal AI Teacher</span>
      </span>
    </a>

    <div class="topbar-auth"></div>
  </header>

  <div id="backdrop" class="backdrop" aria-hidden="true"></div>

  <aside id="sidebar" class="sidebar" aria-hidden="true">
    <div class="sidebar-inner">
      <div class="sidebar-brand">
        <h3>PassSabi AI</h3>
        <p>Your Personal AI Teacher</p>
      </div>

      <button id="newChatBtn" type="button" class="sidebar-newchat">
        + New Chat
      </button>

      <div class="sidebar-divider"></div>

      <section class="sidebar-history-group">
        <div class="history-group-title">Recents</div>
        <div id="chat-history" class="history-group-list"></div>
      </section>

      <div class="sidebar-divider"></div>

      <nav class="sidebar-links" aria-label="Sidebar navigation">
        <a href="user-chat.html">Home</a>
        <a href="profile.html" data-shell-userlink>Profile</a>
        <a href="settings.html">Settings</a>
        <a href="#" data-shell-logout>Logout</a>
      </nav>

      <div class="sidebar-divider"></div>

      <div class="sidebar-footer">
        Founded by <strong>Uzezi Great Efezino</strong>
      </div>
    </div>
  </aside>

  <main class="chat-container">
    <section id="welcome-screen" class="welcome-screen" hidden>
      <div class="welcome-card">
        <div class="welcome-badge">Signed In</div>
        <h1>How can I help you today?</h1>
        <p>Your chats can now sync with your account and future profile features.</p>
      </div>
    </section>

    <div
      id="chat-box"
      role="log"
      aria-live="polite"
      aria-relevant="additions text"
      aria-label="Chat messages">
    </div>

    <div class="chat-footer">
      <form id="chat-form" class="chat-input-wrap" autocomplete="off">
        <textarea
          id="userInput"
          placeholder="Type your question here..."
          required
          spellcheck="false"
          autocomplete="off"
          rows="1"
          enterkeyhint="send"></textarea>

        <button id="sendBtn" type="submit" aria-label="Send message" title="Send message">
          ➤
        </button>
      </form>
    </div>
  </main>

  <script type="module" src="js/user-shell.js"></script>
  <script type="module" src="js/chat.js"></script>
</body>
</html>
