<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Reset your PassSabi AI password." />
  <meta name="theme-color" content="#0f172a" />
  <title>Reset Password | PassSabi AI</title>

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <script type="module" src="js/auth.js"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <header class="auth-header">
        <button type="button" class="back-btn" data-back-button aria-label="Go back">←</button>
        <a class="brand" href="index.html" aria-label="Back to home">
          <div class="brand-badge">P</div>
          <div class="brand-text">
            <strong>PassSabi AI</strong>
            <span>Set a new password</span>
          </div>
        </a>

        <h1 class="auth-title">Reset your password</h1>
        <p class="auth-subtitle">
          Create a new secure password for your PassSabi account.
        </p>
      </header>

      <div class="auth-body">
        <div id="resetNotice" class="notice" aria-live="polite"></div>

        <form id="resetPasswordForm" novalidate>
          <div class="form-group">
            <div class="label-row">
              <label for="newPassword">New password</label>
            </div>
            <div class="input-wrap">
              <input
                id="newPassword"
                type="password"
                placeholder="Enter a new password"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="input-icon-btn"
                data-toggle-password
                data-target="newPassword"
              >
                Show
              </button>
            </div>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="confirmNewPassword">Confirm new password</label>
            </div>
            <div class="input-wrap">
              <input
                id="confirmNewPassword"
                type="password"
                placeholder="Repeat your new password"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="input-icon-btn"
                data-toggle-password
                data-target="confirmNewPassword"
              >
                Show
              </button>
            </div>
          </div>

          <button id="resetBtn" class="auth-btn" type="submit">Update password</button>
        </form>
      </div>

      <div class="auth-footer">
        Remembered it already? <a href="login.html">Back to login</a>
      </div>
    </section>
  </main>
</body>
</html>
