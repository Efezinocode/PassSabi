<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Reset your PassSabi AI password." />
  <meta name="theme-color" content="#0f172a" />
  <title>Forgot Password | PassSabi AI</title>

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <script type="module" src="js/auth.js"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <header class="auth-header">
        <a class="brand" href="index.html" aria-label="Back to home">
          <div class="brand-badge">P</div>
          <div class="brand-text">
            <strong>PassSabi AI</strong>
            <span>Reset your password safely</span>
          </div>
        </a>

        <h1 class="auth-title">Forgot password</h1>
        <p class="auth-subtitle">
          Enter your email address and we will send a password reset link to your inbox.
        </p>
      </header>

      <div class="auth-body">
        <div id="forgotNotice" class="notice" aria-live="polite"></div>

        <form id="forgotPasswordForm" novalidate>
          <div class="form-group">
            <div class="label-row">
              <label for="forgotEmail">Email address</label>
            </div>
            <input
              id="forgotEmail"
              type="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>

          <button id="forgotBtn" class="auth-btn" type="submit">Send reset link</button>
        </form>
      </div>

      <div class="auth-footer">
        Remembered your password? <a href="login.html">Back to login</a>
      </div>
    </section>
  </main>
</body>
</html>
